[baseline]
schema = 1
id = "2026.09"

[toolchain]
channel = "1.97.1"
profile = "minimal"
components = ["rustfmt", "clippy"]

[groups]
foundation = ["thiserror"]
async-runtime = ["tokio"]
native-nng = ["anng"]
dioxus-desktop = ["dioxus", "futures-timer", "serde", "serde_json"]
dioxus-web-fullstack = ["dioxus"]

[group-requirements.dioxus-desktop]
cargo-tools = ["dioxus-cli"]

[group-requirements.dioxus-web-fullstack]
cargo-tools = ["dioxus-cli"]
rust-targets = ["wasm32-unknown-unknown"]

[cargo-tools.dioxus-cli]
executable = "dx"
version = "0.7.10"

[dependencies]
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
anng = { git = "https://github.com/nanomsg/nng-rs", rev = "a474ee0272d18f20c360837e2f602dc53ae3b9ec", default-features = false, features = ["tokio"] }
dioxus = { version = "=0.7.10", default-features = false, features = ["lib", "launch", "logger"] }
futures-timer = "=3.0.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
