# Immutable adoption snapshot of zeta_cat's existing Cargo.lock; no dependency upgrade.
[baseline]
schema = 1
id = "1.97.1-r2"
rust-version = "1.97.1"
revision = 2
released = "2026-09-21"

[toolchain]
channel = "1.97.1"
profile = "minimal"
components = ["rustfmt", "clippy"]

[groups]
cat-network = ["anyhow", "bytes", "clap", "futures", "libc", "ring", "rustls", "rustls-pemfile", "serde", "time", "tokio", "tokio-rustls", "toml"]

[group-requirements]
[cargo-tools]

[dependencies]
anyhow = "=1.0.102"
bytes = "=1.11.1"
clap = { version = "=4.6.1", features = ["derive"] }
futures = "=0.3.32"
libc = "=0.2.185"
ring = "=0.17.14"
rustls = { version = "=0.23.38", features = ["ring"] }
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
time = { version = "=0.3.47", default-features = false, features = ["formatting"] }
tokio = { version = "=1.52.1", features = ["macros", "net", "io-util", "rt-multi-thread", "signal", "sync", "time", "process"] }
tokio-rustls = "=0.26.4"
toml = "=0.8.23"
